# Deploy to Vercel (production)
#
# Why this workflow exists:
#   The Vercel project `agent-marketplace` (owned by the beanbag-ai
#   team) is not subscribed to a GitHub push webhook — its Git
#   integration only allows the ScaleGroup org, which we cannot
#   transfer this repo into. Without a webhook, `git push` alone
#   does nothing; production deploys only happen when someone runs
#   `vercel --prod` from a local checkout.
#
#   This workflow makes "push to GitHub" trigger a production
#   deploy automatically by running the Vercel CLI from CI with a
#   personal access token. It works regardless of which GitHub
#   account/org hosts the repo, because authentication is via the
#   token, not a GitHub App installation.
#
# One-time setup (in this GitHub repo's Settings → Secrets and
# variables → Actions, add three repository secrets):
#   - VERCEL_TOKEN       — created at Vercel → Account Settings →
#                          Tokens, scoped to the beanbag-ai team.
#   - VERCEL_ORG_ID      — from `.vercel/project.json` after a
#                          local `vercel link` to the
#                          beanbag-ai/agent-marketplace project.
#   - VERCEL_PROJECT_ID  — same file.
#
# Deploy flow:
#   `vercel deploy --prod` uploads the repo's source tree and lets
#   Vercel's build infrastructure compile it. This matches what
#   happens when you run `vercel --prod` from a local checkout:
#   Vercel injects the project's production env vars (Upstash Redis
#   URLs, Anthropic API key, etc.) at build time, so routes that
#   touch `process.env.*` at module load don't blow up the build.
#
#   We deliberately do NOT run `vercel build --prebuilt` in CI:
#   that path requires env vars to be pulled down to the runner
#   first, and `vercel pull` doesn't always include them (Sensitive
#   vars, scope mismatches, etc.) — which causes Next.js's
#   page-data collection to fail with "Missing required env var X".
name: Deploy to Vercel (production)

on:
  push:
    # Add or remove branches here if your production branch changes.
    # Today the local working branch is `agent-marketplace`; `main`
    # is included so pushes to the default branch also deploy.
    branches: [main, agent-marketplace]

  # Allow manual runs from the Actions tab — handy when you need
  # to re-deploy without a code change (e.g., after rotating env
  # vars in the Vercel dashboard).
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Project-wide env so every step sees the IDs Vercel CLI needs.
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Match the runtime Vercel uses for Next.js 15 (Node 20+).
          # Bump to 22 if/when the project moves to Node 22.
          node-version: 20
          cache: npm

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Deploy to production (Vercel builds remotely)
        # Uploads source + lets Vercel build with env vars injected
        # automatically. Equivalent to running `vercel --prod` from
        # a local checkout. The deployment URL is printed to stdout.
        run: vercel deploy --prod --yes --token=${{ secrets.VERCEL_TOKEN }}
